<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="XPOSTERS — bold, black-and-white movie, anime, car and motivational posters." />
    <title>XPOSTERS — Posters that make a statement</title>
    <!-- Loaded as <link> tags (not a CSS @import) so the browser can start
         fetching fonts immediately, in parallel with everything else,
         instead of waiting for the main stylesheet to load and parse first
         before it even discovers the font request. preconnect warms up the
         connection to both Google Fonts hosts ahead of time. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every poster image comes from Cloudinary and every API call goes to
         the Render backend - warming up both connections up front means the
         browser isn't paying DNS+TLS+TCP handshake cost on the very first
         image/data request once the page's JS has loaded. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://xposters-backend.onrender.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- The homepage hero logo is the largest thing painted on first load
         (LCP), but it only exists inside a React component - the browser's
         HTML preload scanner can't see it until the JS bundle has downloaded,
         parsed and rendered. Preloading it here lets the browser fetch it in
         parallel with everything else from the very start, instead of only
         discovering it after React mounts. -->
    <link rel="preload" as="image" href="/logo-mark.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
